<!DOCTYPE html>
<html>
<head>
  <title>Lost Person Registration</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial;
      background: #f2f2f2;
    }
    .box {
      background: white;
      max-width: 400px;
      margin: 40px auto;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px #aaa;
    }
    input {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
    }
    button {
      width: 100%;
      padding: 10px;
      background: black;
      color: white;
      border: none;
      border-radius: 5px;
    }
    #qr {
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>Register Emergency Identity</h2>

  <input id="name" placeholder="Name">
  <input id="age" placeholder="Age">
  <input id="condition" placeholder="Condition">
  <input id="contact" placeholder="Emergency Contact">
  <input id="relation" placeholder="Relation">

  <button onclick="generateQR()">Generate QR</button>

  <div id="qr"></div>
</div>

<script>
function generateQR() {
  const params = new URLSearchParams({
    name: name.value,
    age: age.value,
    condition: condition.value,
    contact: contact.value,
    relation: relation.value
  });

  const url = "https://YOUR_USERNAME.github.io/YOUR_REPO/view.html?" + params.toString();

  document.getElementById("qr").innerHTML = "";
  new QRCode(document.getElementById("qr"), {
    text: url,
    width: 180,
    height: 180
  });
}
</script>

</body>
</html>
