<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Emergency QR Registration</title>

  <!-- QR library -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #eef2ff);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 18px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      padding: 28px;
      width: 100%;
      max-width: 380px;
    }

    h2 {
      text-align: center;
      margin-bottom: 18px;
      color: #1f2937;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid #c7d2fe;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.25);
    }

    button {
      margin-top: 12px;
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 8px 20px rgba(22, 163, 74, 0.35);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 26px rgba(22, 163, 74, 0.45);
    }

    #qr {
      margin-top: 22px;
      display: flex;
      justify-content: center;
    }

    .note {
      margin-top: 12px;
      text-align: center;
      font-size: 12px;
      color: #374151;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Emergency Identity</h2>

    <input id="name" placeholder="Person Name">
    <input id="age" placeholder="Age">
    <input id="condition" placeholder="Medical Condition">
    <input id="contact" placeholder="Emergency Contact Number">
    <input id="relation" placeholder="Relation (Mother / Son / etc)">

    <button onclick="generateQR()">Generate QR Code</button>

    <div id="qr"></div>

    <div class="note">
      Scan this QR to view emergency details
    </div>
  </div>

  <script>
    function generateQR() {
      const params = new URLSearchParams({
        name: document.getElementById("name").value,
        age: document.getElementById("age").value,
        condition: document.getElementById("condition").value,
        contact: document.getElementById("contact").value,
        relation: document.getElementById("relation").value
      });

      const url =
        "https://mahehekkk.github.io/emergency-qr/view.html?" +
        params.toString();

      document.getElementById("qr").innerHTML = "";

      new QRCode(document.getElementById("qr"), {
        text: url,
        width: 180,
        height: 180,
        colorDark: "#111827",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }
  </script>

</body>
</html>
